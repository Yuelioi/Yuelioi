name: Generate snake animation

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main
    paths:
      - .github/workflows/snake.yml

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-rust.svg?color_snake=%239C3321&color_dots=%23EBEDF0,%23FDE3DA,%23F9BEA9,%23E77E60,%23CE422B
            dist/github-snake-rust-dark.svg?palette=github-dark&color_snake=%23F28C6D&color_dots=%23161B22,%234B2925,%23833D31,%23B6533D,%23CE422B

      - name: push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
